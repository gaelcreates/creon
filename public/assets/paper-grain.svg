<svg xmlns="http://www.w3.org/2000/svg" width="320" height="320" viewBox="0 0 320 320">
  <filter id="grain">
    <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" seed="7"></feTurbulence>
    <feColorMatrix values="0 0 0 0 0.06  0 0 0 0 0.02  0 0 0 0 0.04  0 0 0 0.35 0"></feColorMatrix>
  </filter>
  <filter id="grain2">
    <feTurbulence type="fractalNoise" baseFrequency="0.4" numOctaves="3" seed="3"></feTurbulence>
    <feColorMatrix values="0 0 0 0 0.4  0 0 0 0 0.3  0 0 0 0 0.2  0 0 0 0.18 0"></feColorMatrix>
  </filter>
  <rect width="320" height="320" filter="url(#grain)"></rect>
  <rect width="320" height="320" filter="url(#grain2)" opacity="0.7"></rect>
</svg>